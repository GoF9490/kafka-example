version: '3.8'

services:
  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka
    restart: unless-stopped
    ports:
      - "9093:9093" # 외부(9093) -> 컨테이너 내부 EXTERNAL(9093)
    environment:
      # 클러스터 고유 ID (모든 노드가 반드시 동일한 22자 Base64 UUID 사용)
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      # 컨테이너 ID. 브로커 또는 컨트롤러는 같은 역할마다 별도의 컨테이너를 가져야 한다.
      # (ex: 브로커3, 컨트롤러2 라면, 최소 3개 최대 5개의 컨테이너 필요.)
      KAFKA_NODE_ID: 1
      # 해당 컨테이너의 역할을 지정한다. 두 역할을 지정하면 combine 모드.
      KAFKA_PROCESS_ROLES: broker,controller # 3버전 이후부터 controller가 ZooKeeper의 역할을 대체

      # 사용할 포트번호에 이름을 부여한다.
      KAFKA_LISTENERS: CONTROLLER://:9091,INTERNAL://:9092,EXTERNAL://:9093
      # 외부에서 이 브로커를 접근할 때 사용할 포트번호 명에 주소와 포트를 명시한다.
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9093
      # 각 포트번호에 사용될 프로토콜 옵션을 지정한다.
      # PLAINTEXT: 보안설정없는 기본값.
      # SASL_PLAINTEXT: SASL(Simple Authentication and Security Layer). 쉽게 생각해서 로그인 옵션.
      # SASL_SSL: 로그인과 SSL인증서를 같이 검증. SSL 인증서 발급 필요.
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:SASL_PLAINTEXT
      # 내부에서 브로커들이 사용할 포트번호 명
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # controller가 사용할 포트번호 명을 지정해준다.
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # 컨트롤러 투표(Quorum)에 참여할 노드 주소를 지정한다. (1번 노드의 9093번 포트)
      # 브로커가 다수일 때 복수의 노드 주소를 지정하는 것이 안정적.
      # 투표자는 2명을 둘 경우, 한 명이 서버 다운될 경우, 다른 한명이 아무리 투표해도 과반수를 못채우므로 에러가 발생함. (KRaft 알고리즘)
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9091,2@controller-1:9091,3@controller-2:9091

      # SASL 설정 추가
      # 인증 매커니즘의 허용 목록 정의.
      # PLAIN: 평문 아이디 비밀번호
      # SCRAM-SHA-256: 암호화 로그인 방식. 밑의 JAAS 설정방법 이외에 별도의 방법으로 계정을 생성해야 함.
      KAFKA_SASL_ENABLED_MECHANISMS: PLAIN
      # 내부 브로커간 통신방식 정의. 내부통신이 PLAINTEXT니 별도의 설정 필요 없음.
      # KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL: PLAIN

      # KAFKA_SASL_ENABLED_MECHANISMS 옵션이 PLAIN일 경우 사용. 별도의 설정 파일(JAAS)없이, 로그인 계정 설정 가능.
      # KAFKA_LISTENER_NAME_[*]_PLAIN_SASL_JAAS_CONFIG [*] 부분에 외부 접속 가능한 포트번호 명 할당
      KAFKA_LISTENER_NAME_EXTERNAL_PLAIN_SASL_JAAS_CONFIG: >
        org.apache.kafka.common.security.plain.PlainLoginModule required
        username="admin"
        password="password"
        user_admin="adminpassword"
        user_consumer="consumerpassword"
        user_producer="producerpassword";
      # 위 작성되는 내용은 PlainLoginModule 문법을 따름
      # username & password 는 브로커간 내부 통신에 사용. 내부통신이 SASL_PLAINTEXT이고, KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL가 PLAIN 일 경우 작성. 현재 상황같은경우 필요없음.
      # 그 아래로 user_[*] 에 해당하는 값들은 각각 외부에서 접속할 계정이름과, 해당 계정의 패스워드를 가리킴.
      # 현재 내용으로는 admin 계정과, consumer 계정을 외부에서 접속 가능함.
      # 추가로 user_[*] 규칙으로 여러 계정 작성 가능. (ex: user_XXX="1234")

      # 로그 주소
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs

      # 자동 토픽 생성 허용 : 기본값 true
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # 새 토픽 생성 시 기본 복제수.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2
      # 토픽당 파티션 기본값은 1개 -> 파티션은 추후 변경이 어려우므로 여유있게 세팅하길 권장
      # 브로커의 모든 토픽에 대한 설정으로, 토픽마다 크기를 다르게 하려면 cli를 통해 토픽생성
      KAFKA_NUM_PARTITIONS: 4
      # 메시지 보관 시간. 기본값은 168(7 * 24).
      KAFKA_LOG_RETENTION_HOURS: 168

  # controller
  controller-1:
    image: apache/kafka:3.7.0
    container_name: controller-1
    restart: unless-stopped
    environment:
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: controller
      KAFKA_LISTENERS: CONTROLLER://:9091
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9091,2@controller-1:9091,3@controller-2:9091
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs

  controller-2:
    image: apache/kafka:3.7.0
    container_name: controller-2
    restart: unless-stopped
    environment:
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: controller
      KAFKA_LISTENERS: CONTROLLER://:9091
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9091,2@controller-1:9091,3@controller-2:9091
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs

  # broker
  broker-1:
    image: apache/kafka:3.7.0
    container_name: broker-1
    restart: unless-stopped
    ports:
      - "9094:9094"
    environment:
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      KAFKA_NODE_ID: 101
      KAFKA_PROCESS_ROLES: broker
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://broker-1:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:SASL_PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9091,2@controller-1:9091,3@controller-2:9091
      KAFKA_SASL_ENABLED_MECHANISMS: PLAIN
      KAFKA_LISTENER_NAME_EXTERNAL_PLAIN_SASL_JAAS_CONFIG: >
        org.apache.kafka.common.security.plain.PlainLoginModule required
        user_admin="adminpassword"
        user_consumer="consumerpassword"
        user_producer="producerpassword";
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2
      KAFKA_NUM_PARTITIONS: 4
      KAFKA_LOG_RETENTION_HOURS: 168

  broker-2:
    image: apache/kafka:3.7.0
    container_name: broker-2
    restart: unless-stopped
    ports:
      - "9095:9095"
    environment:
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      KAFKA_NODE_ID: 102
      KAFKA_PROCESS_ROLES: broker
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9095
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://broker-2:9092,EXTERNAL://localhost:9095
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:SASL_PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9091,2@controller-1:9091,3@controller-2:9091
      KAFKA_SASL_ENABLED_MECHANISMS: PLAIN
      KAFKA_LISTENER_NAME_EXTERNAL_PLAIN_SASL_JAAS_CONFIG: >
        org.apache.kafka.common.security.plain.PlainLoginModule required
        user_admin="adminpassword"
        user_consumer="consumerpassword"
        user_producer="producerpassword";
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2
      KAFKA_NUM_PARTITIONS: 4
      KAFKA_LOG_RETENTION_HOURS: 168

