server:
  port: 8081

spring:
  kafka:
    # kafka서버의 url
    bootstrap-servers: localhost:9093,localhost:9094,localhost:9095
    # 통신 프로토콜 (PLAINTEXT일 경우 별도 설정 필요 X)
    security:
      protocol: SASL_PLAINTEXT
    # SASL 통신 옵션 (ex: SCRAM-SHA-256)
    properties:
      sasl.mechanism: PLAIN
      sasl.jaas.config: org.apache.kafka.common.security.plain.PlainLoginModule required username="admin" password="adminpassword";
    # consumer 추가 설정 옵션
    consumer:
      # groupid는 컨슈머 그룹을 식별하는 ID로서, 동일한 그룹ID를 가진 컨슈머들은 메시지를 분담해서 consume
      group-id: message-topic-group
      admin-topic-dlq-group-id: message-topic-dlq-group

      # auto-offset-reset: 컨슈머 그룹이 해당 토픽을 처음 구독하거나, 기존에 기록된 오프셋이 데이터 보관 기간(log.retention.hours) 만료로 삭제되었을 때 어디서부터 읽을지 결정. 기본값은 latest.
      # earliest: 파티션의 가장 처음(맨 앞, 0번 오프셋)부터 쌓여있는 모든 과거 데이터를 차례대로 읽음.
      # latest: 컨슈머가 연결된 시점 이후에 새로 들어오는 최신 메시지부터 읽음. (기존에 쌓인 데이터는 무시)
      # none: 기존 커밋된 오프셋 기록이 없으면 데이터를 읽지 않고 즉시 NoOffsetForPartitionException 예외(에러)를 발생.
      auto-offset-reset: latest

      # enable-auto-commit: 커밋(메세지 읽음 처리)를 자동으로 할 것인지, 수동으로 할 것인지 지정하는 옵션. 기본값은 true.
      # true: 컨슈머가 백그라운드에서 일정 주기(auto.commit.interval.ms, 기본 5초)마다 마지막으로 가져간(Poll) 오프셋을 자동으로 커밋.
      # false: 수동으로 커밋(Acknowledgment.acknowledge())을 실행하거나, 작업 성공시 Spring Kafka의 AckMode가 명시적으로 커밋을 실행. AckMode는 아래에 후술.
      enable-auto-commit: false

      # 역직렬화 옵션. DefaultKafkaConsumerFactory 생성시 커스텀 옵션으로 별도로 설정도 가능. 그럴 경우 커스텀 설정을 따름. 자세한건 KafkaConsumerConfig 참조.
      # key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

    listener:
      # enable-auto-commit 값이 false일 경우, AckMode의 옵션. config으로 커스텀 설정 가능. 기본값은 BATCH.
      # RECORD: @KafkaListener 메서드가 메시지 1건을 정상 처리할 때마다 즉시 커밋. (Spring이 자동 실행)
      # BATCH: 한 번의 poll()로 가져온 메시지 묶음(Batch) 전체가 모두 처리된 후 한꺼번에 커밋. (Spring이 자동 실행)
      # MANUAL: 개발자가 ack.acknowledge()를 호출하면 배치 처리가 끝난 시점에 모아서 커밋. (Acknowledgment 호출 필수)
      # MANUAL_IMMEDIATE: 개발자가 ack.acknowledge()를 호출하는 그 즉시 Kafka 브로커에 커밋 요청 전송. (Acknowledgment 호출 필수)
      ack-mode: MANUAL

    # kafka streams
    streams:
      # kafka streams에 사용될 그룹ID
      application-id: kafka-streams-example
      properties:
        # 별도의 직렬화/역직렬화를 코드에 명시하지 않았을 때 기본으로 사용할 데이터 변환 규칙
        default.key.serde: org.apache.kafka.common.serialization.Serdes$StringSerde
        default.value.serde: org.apache.kafka.common.serialization.Serdes$StringSerde
        # 상태 저장소(RocksDB) 앞에서 데이터를 임시로 모아두는 레코드 캐시의 최대 메모리 크기. 기본값은 10mb.
        # 값을 0으로 할당시, 지연없이 들어오는 데이터를 바로바로 처리.
        statestore.cache.max.bytes: 0
        # 위의 캐시 크기가 존재할 때, 용량이 전부 채워지지 않아도 설정된 주기마다 발송됨. 밀리초(ms)단위이며, 기본값은 30000.
        # commit.interval.ms: 1000

# kafka streams를 하나의 서버에 두개 이상의 그룹ID로 사용하려면, 별도의 설정을 가해야함. 추가 설정은 KafkaStreamsConfig 참조.
custom:
  kafka:
    streams:
      message-count-id: message-count-group
      duplicate-alert-id: duplicate-alert-group
